<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Music Library</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * {
    margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif;
  }
  body {
    background: url('https://i.imgur.com/uNWSHGy.png') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 50px 20px;
  }
  .container {
    backdrop-filter: blur(10px) saturate(180%);
    -webkit-backdrop-filter: blur(10px) saturate(180%);
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 30px;
    width: 100%;
    max-width: 900px;
  }
  h1 {
    color: white; text-align: center; margin-bottom: 20px;
  }
  .search-bar {
    width: 100%; margin-bottom: 20px;
  }
  .search-bar input {
    width: 100%; padding: 12px 15px; border-radius: 15px; border: none; outline: none;
    font-size: 16px; backdrop-filter: blur(8px); background: rgba(255,255,255,0.1); color: white;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.7); }
  .tabs {
    display: flex; justify-content: space-around; margin-bottom: 20px;
  }
  .tab {
    padding: 10px 20px; border-radius: 15px; cursor: pointer; color: white; font-weight: 500; transition: 0.3s;
  }
  .tab.active, .tab:hover {
    background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);
  }
  .music-list {
    list-style: none;
  }
  .music-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.1); border-radius: 15px;
    padding: 12px 15px; margin-bottom: 10px; backdrop-filter: blur(8px);
    cursor: pointer; transition: 0.3s;
  }
  .music-item:hover { background: rgba(255,255,255,0.2); }
  .music-item .info {
    color:white;
  }
  .music-item .info .title {
    font-weight:500; font-size:16px;
  }
  .folder-title {
    color:white; margin-top:20px; font-weight:500; font-size:18px;
  }

  /* নতুন alpha-index স্টাইল */
  .alpha-index {
    position: fixed;
    right: 30px;
    top: 100px;
    height: calc(100vh - 120px); /* উপরে 100px এবং নিচে 20px স্পেস */
    display: flex;
    flex-direction: column;
    justify-content: space-between; /* স্পেস পুরোটা সমান করে দেবে */
    user-select: none;
    z-index: 1000;
    padding: 4px 8px;
    background: rgba(0,0,0,0.15);
    border-radius: 12px;
    font-weight: 700;
    color: white;
    font-size: 14px;
  }

  .alpha-index div {
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    text-align: center;
    transition: background 0.3s, color 0.3s;
  }

  .alpha-index div:hover,
  .alpha-index div.active {
    background: rgba(255,255,255,0.3);
    color: #000;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>My Music Library</h1>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by song..." />
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="songs">Songs</div>
      <div class="tab" data-tab="folders">Folders</div>
    </div>

    <ul class="music-list" id="music-list"></ul>
  </div>

  <!-- A-Z-# ইনডেক্স -->
  <div class="alpha-index" id="alphaIndex">
    <!-- JS দিয়ে অক্ষর বসবে -->
  </div>

<script>
  const types = ['bangla','english','hindi','arabic','lofi','slowed-reverbed'];
  let musicData = [];

  async function loadAllMusic() {
    let allSongs = [];
    for(const type of types){
      try{
        const res = await fetch(`data/${type}.json`);
        const data = await res.json();
        data.forEach(song => {
          song.type = type;
        });
        allSongs = allSongs.concat(data);
      } catch(e){
        console.error(`Failed to load ${type}.json`, e);
      }
    }
    musicData = allSongs;
  }

  function displaySongs(list){
    const musicList = document.getElementById('music-list');
    if(list.length === 0){
      musicList.innerHTML = `<li style="color:white; text-align:center; padding:20px;">No results found</li>`;
      return;
    }
    musicList.innerHTML = list.map(song => `
      <li class="music-item">
        <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(song.type)}" class="info" style="color:white;text-decoration:none;">
          <span class="title">${song.name}</span>
          <span style="font-size:12px;color:rgba(255,255,255,0.5)">[${song.type}]</span>
        </a>
      </li>
    `).join('');
  }

  function displayFolders(list){
    const musicList = document.getElementById('music-list');
    let html = '';
    types.forEach(type=>{
      const songs = list.filter(s => s.type === type);
      if(songs.length > 0){
        html += `<div class="folder-title">${type.toUpperCase()}</div>`;
        html += songs.map(song=>`
          <li class="music-item">
            <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(type)}" style="color:white;text-decoration:none;">
              ${song.name}
            </a>
          </li>
        `).join('');
      }
    });
    musicList.innerHTML = html || `<li style="color:white; text-align:center; padding:20px;">No folders found</li>`;
  }

  // A-Z-# লেটার গুলো
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  const alphaIndex = document.getElementById('alphaIndex');
  const musicList = document.getElementById('music-list');
  const searchInput = document.getElementById('searchInput');
  const tabs = document.querySelectorAll('.tab');

  // ইনডেক্সে অক্ষর বসানো
  alphabet.forEach(letter => {
    const div = document.createElement('div');
    div.textContent = letter;
    div.addEventListener('click', () => {
      // ক্লিক করলে ওই অক্ষরের প্রথম গানের জায়গায় স্ক্রল হবে
      scrollToLetter(letter);
    });
    alphaIndex.appendChild(div);
  });

  // scrollToLetter ফাংশন - যেই অক্ষর থেকে শুরু হয় সেই গান পর্যন্ত স্ক্রল করবে
  function scrollToLetter(letter) {
    let filteredSongs = musicData;

    // সার্চ ইমপুট থাকলে সেটা বিবেচনা করব না, সব গানে দেখব
    if(searchInput.value.trim() !== '') filteredSongs = musicData;

    // যেই তালিকার মধ্যে activeTab আছে সেটা দেখব (songs/folders)
    const activeTab = document.querySelector('.tab.active').dataset.tab;

    // songs tab হলে সরাসরি music-item এ স্ক্রল করব
    if(activeTab === 'songs') {
      // প্রথম গান যেটার name letter দিয়ে শুরু হয়
      let targetSong = filteredSongs.find(s => s.name.charAt(0).toUpperCase() === letter);
      if(!targetSong) {
        if(letter === '#') {
          // # হলে নামের প্রথম ক্যারেক্টার অক্ষর না হলে ধরব
          targetSong = filteredSongs.find(s => !(/[A-Z]/.test(s.name.charAt(0).toUpperCase())));
        }
      }
      if(targetSong) {
        // ওই গানকে খুঁজে <a> এলিমেন্ট নেবো, তারপর scrollIntoView করব
        const link = document.querySelector(`.music-item a[href*="${encodeURIComponent(targetSong.name)}"]`);
        if(link) link.scrollIntoView({behavior: 'smooth', block: 'start'});
      }
    } else if(activeTab === 'folders') {
      // ফোল্ডার ট্যাবে গুলো আলাদা আলাদা ভাগে আছে, তাই একই কাজ নাম দিয়ে করব
      let targetSong = filteredSongs.find(s => s.name.charAt(0).toUpperCase() === letter);
      if(!targetSong) {
        if(letter === '#') {
          targetSong = filteredSongs.find(s => !(/[A-Z]/.test(s.name.charAt(0).toUpperCase())));
        }
      }
      if(targetSong) {
        const link = document.querySelector(`.music-list a[href*="${encodeURIComponent(targetSong.name)}"]`);
        if(link) link.scrollIntoView({behavior: 'smooth', block: 'start'});
      }
    }
  }

  // scroll করে ডান পাশের অক্ষর হাইলাইট করা
  function highlightLetterOnScroll() {
    // স্ক্রল পজিশন
    const scrollTop = musicList.scrollTop;
    const items = document.querySelectorAll('.music-item');
    let currentLetter = null;

    // যেহেতু musicList তে scroll হয় না, scroll হচ্ছে পুরো body বা window-এ, তাই আমরা window.scrollY নিবো

    // window.scrollY থেকে container এর উপর ভিত্তি করে স্ক্রল পজিশন নিয়ে কাজ করব
    const container = document.querySelector('.container');
    const containerRect = container.getBoundingClientRect();

    // activeLetter পাবে যেটা স্ক্রল অনুযায়ী প্রায় উপরের দিকে আছে
    for(let i = 0; i < items.length; i++) {
      const rect = items[i].getBoundingClientRect();
      if(rect.top >= containerRect.top) {
        const firstChar = items[i].querySelector('.title')?.textContent?.charAt(0).toUpperCase();
        if(firstChar && alphabet.includes(firstChar)) {
          currentLetter = firstChar;
          break;
        } else {
          currentLetter = '#';
          break;
        }
      }
    }
    // ডিফল্ট ধরলে প্রথম অক্ষর
    if(!currentLetter && items.length > 0){
      const firstChar = items[0].querySelector('.title')?.textContent?.charAt(0).toUpperCase();
      currentLetter = (firstChar && alphabet.includes(firstChar)) ? firstChar : '#';
    }

    // সব লেটার থেকে active ক্লাস সরাও
    alphaIndex.querySelectorAll('div').forEach(div => div.classList.remove('active'));
    // যেটা মেলালাম সেটাকে active দাও
    if(currentLetter) {
      const activeDiv = Array.from(alphaIndex.children).find(div => div.textContent === currentLetter);
      if(activeDiv) activeDiv.classList.add('active');
    }
  }

  // scroll event window এ দিবো, কারণ music-list এ scroll হয় না
  window.addEventListener('scroll', highlightLetterOnScroll);

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const activeTab = tab.dataset.tab;
      if(activeTab==='songs') displaySongs(musicData);
      else if(activeTab==='folders') displayFolders(musicData);
      searchInput.value = '';
      // ট্যাব পরিবর্তনের পর ইনডেক্স হাইলাইট রিফ্রেশ
      setTimeout(highlightLetterOnScroll, 100);
    });
  });

  searchInput.addEventListener('input', ()=>{
    const query = searchInput.value.toLowerCase();
    const filtered = musicData.filter(song => song.name.toLowerCase().includes(query));
    const activeTab = document.querySelector('.tab.active').dataset.tab;
    if(activeTab==='songs') displaySongs(filtered);
    else if(activeTab==='folders') displayFolders(filtered);

    setTimeout(highlightLetterOnScroll, 100);
  });

  loadAllMusic().then(()=> {
    displaySongs(musicData);
    highlightLetterOnScroll();
  });
</script>

</body>
</html>
