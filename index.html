<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Music Library</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * {
    margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif;
  }
  body {
    background: url('https://i.imgur.com/uNWSHGy.png') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 50px 20px;
  }
  .container {
    backdrop-filter: blur(10px) saturate(180%);
    -webkit-backdrop-filter: blur(10px) saturate(180%);
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 30px 30px 30px 30px;
    width: 100%;
    max-width: 900px;
    position: relative;
    display: flex;
  }
  h1 {
    color: white; text-align: center; margin-bottom: 20px; width: 100%;
  }
  .content-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .search-bar {
    width: 100%; margin-bottom: 20px;
  }
  .search-bar input {
    width: 100%; padding: 12px 15px; border-radius: 15px; border: none; outline: none;
    font-size: 16px; backdrop-filter: blur(8px); background: rgba(255,255,255,0.1); color: white;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.7); }
  .tabs {
    display: flex; justify-content: space-around; margin-bottom: 20px;
  }
  .tab {
    padding: 10px 20px; border-radius: 15px; cursor: pointer; color: white; font-weight: 500; transition: 0.3s;
  }
  .tab.active, .tab:hover {
    background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);
  }
  .music-list {
    list-style: none;
    overflow-y: auto;
    max-height: 520px;
    padding-right: 5px; /* to avoid text hidden under alphabet nav */
    scroll-behavior: smooth;
  }
  /* Hide scrollbar but keep scrolling */
  .music-list::-webkit-scrollbar {
    display: none;
  }
  .music-list {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
  }
  .music-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.1); border-radius: 15px;
    padding: 12px 15px; margin-bottom: 10px; backdrop-filter: blur(8px);
    cursor: pointer; transition: 0.3s;
  }
  .music-item:hover { background: rgba(255,255,255,0.2); }
  .music-item .info {
    color:white;
    flex: 1;
  }
  .music-item .info .title {
    font-weight:500; font-size:16px;
    user-select:none;
  }
  .folder-title {
    color:white; margin-top:20px; font-weight:500; font-size:18px;
  }

  /* Alphabet Nav on right */
  .alphabet-nav {
    position: relative;
    margin-left: 15px;
    user-select: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    max-height: 520px;
  }
  .alphabet-nav div {
    padding: 6px 10px;
    margin: 2px 0;
    color: white;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: background-color 0.3s, color 0.3s;
    text-align: center;
    background: rgba(255,255,255,0.1);
    min-width: 28px;
  }
  .alphabet-nav div:hover {
    background: rgba(255,255,255,0.3);
  }
  .alphabet-nav div.active-letter {
    background: #0099ff;
    color: white;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="content-wrapper">
      <h1>My Music Library</h1>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by song..." />
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="songs">Songs</div>
        <div class="tab" data-tab="folders">Folders</div>
      </div>

      <ul class="music-list" id="music-list"></ul>
    </div>
    <div class="alphabet-nav" id="alphabet-nav"></div>
  </div>

<script>
  const types = ['bangla','english','hindi','arabic','lofi','slowed-reverbed'];
  let musicData = [];
  let filteredData = [];
  let currentTab = 'songs';

  // Load all music JSONs
  async function loadAllMusic() {
    let allSongs = [];
    for(const type of types){
      try{
        const res = await fetch(`data/${type}.json`);
        const data = await res.json();
        data.forEach(song => {
          song.type = type;
        });
        allSongs = allSongs.concat(data);
      } catch(e){
        console.error(`Failed to load ${type}.json`, e);
      }
    }
    musicData = allSongs;
    filteredData = allSongs;
  }

  // Sort songs alphabetically by name A-Z
  function sortSongsAZ(list){
    return list.slice().sort((a,b)=> a.name.localeCompare(b.name));
  }

  // Display songs list
  function displaySongs(list){
    const musicList = document.getElementById('music-list');
    if(list.length === 0){
      musicList.innerHTML = `<li style="color:white; text-align:center; padding:20px;">No results found</li>`;
      return;
    }

    const sortedList = sortSongsAZ(list);

    musicList.innerHTML = sortedList.map(song => `
      <li class="music-item" tabindex="0" data-name="${song.name.toLowerCase()}" data-type="${song.type}">
        <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(song.type)}" class="info" style="color:white;text-decoration:none;flex:1;display:block;">
          <span class="title">${song.name}</span>
          <span style="font-size:12px;color:rgba(255,255,255,0.5)">[${song.type}]</span>
        </a>
      </li>
    `).join('');

    // Attach click event to entire music-item so clicking anywhere plays
    document.querySelectorAll('.music-item').forEach(item => {
      item.addEventListener('click', () => {
        item.querySelector('a').click();
      });
    });
  }

  // Display folders view with toggle for songs inside
  function displayFolders(list){
    const musicList = document.getElementById('music-list');
    let html = '';
    types.forEach(type=>{
      const songs = list.filter(s => s.type === type);
      if(songs.length > 0){
        html += `<div class="folder-title">${type.toUpperCase()}</div>`;
        html += songs.map(song=>`
          <li class="music-item" tabindex="0">
            <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(type)}" style="color:white;text-decoration:none;display:block;flex:1;">
              ${song.name}
            </a>
          </li>
        `).join('');
      }
    });
    musicList.innerHTML = html || `<li style="color:white; text-align:center; padding:20px;">No folders found</li>`;
  }

  // Alphabet Navigation logic
  const alphabetNav = document.getElementById('alphabet-nav');
  const musicListEl = document.getElementById('music-list');
  const searchInput = document.getElementById('searchInput');
  const tabs = document.querySelectorAll('.tab');

  // Build letters from current filteredData (songs tab only)
  function buildAlphabetNav(list) {
    alphabetNav.innerHTML = '';

    // Get unique first letters or #
    let lettersSet = new Set(list.map(s => {
      let c = s.name.charAt(0).toUpperCase();
      if(c >= 'A' && c <= 'Z') return c;
      else return '#';
    }));

    // Sort letters A-Z with # last
    let letters = Array.from(lettersSet);
    letters.sort((a,b)=>{
      if(a === '#') return 1;
      if(b === '#') return -1;
      return a.localeCompare(b);
    });

    letters.forEach(letter => {
      const div = document.createElement('div');
      div.textContent = letter;
      div.dataset.letter = letter;
      div.addEventListener('click', () => {
        scrollToLetter(letter);
      });
      alphabetNav.appendChild(div);
    });
  }

  // Scroll to first song starting with letter
  function scrollToLetter(letter){
    setActiveLetter(letter);
    const items = musicListEl.querySelectorAll('.music-item');
    for(const item of items){
      const firstChar = item.dataset.name.charAt(0).toUpperCase();
      if(letter === '#'){
        if(!(firstChar >= 'A' && firstChar <= 'Z')){
          item.scrollIntoView({behavior:'smooth', block:'start'});
          break;
        }
      } else {
        if(firstChar === letter){
          item.scrollIntoView({behavior:'smooth', block:'start'});
          break;
        }
      }
    }
  }

  // Highlight active letter in alphabet nav
  function setActiveLetter(letter){
    const lettersDivs = alphabetNav.querySelectorAll('div');
    lettersDivs.forEach(div=>{
      div.classList.toggle('active-letter', div.dataset.letter === letter);
    });
    currentActiveLetter = letter;
  }

  // ScrollSpy logic: detect top visible song and mark alphabet accordingly
  function onScrollSpy(){
    const items = musicListEl.querySelectorAll('.music-item');
    const containerRect = musicListEl.getBoundingClientRect();

    for(const item of items){
      const rect = item.getBoundingClientRect();
      if(rect.top >= containerRect.top + 5){
        const firstChar = item.dataset.name.charAt(0).toUpperCase();
        let letter = (firstChar >= 'A' && firstChar <= 'Z') ? firstChar : '#';
        if(letter !== currentActiveLetter){
          setActiveLetter(letter);
        }
        break;
      }
    }
  }

  // Event listeners for tabs
  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      searchInput.value = '';
      if(currentTab === 'songs'){
        filteredData = musicData;
        displaySongs(filteredData);
        buildAlphabetNav(filteredData);
        setTimeout(() => {
          // Reset scroll and active letter
          musicListEl.scrollTop = 0;
          setActiveLetter(filteredData.length ? getFirstLetter(filteredData[0].name) : null);
        }, 100);
      } else {
        displayFolders(filteredData);
        alphabetNav.innerHTML = '';
      }
    });
  });

  // Search input logic
  searchInput.addEventListener('input', ()=>{
    const query = searchInput.value.toLowerCase();
    filteredData = musicData.filter(song => song.name.toLowerCase().includes(query));
    if(currentTab === 'songs'){
      displaySongs(filteredData);
      buildAlphabetNav(filteredData);
      setTimeout(() => {
        musicListEl.scrollTop = 0;
        setActiveLetter(filteredData.length ? getFirstLetter(filteredData[0].name) : null);
      }, 100);
    } else {
      displayFolders(filteredData);
    }
  });

  // Helper for first letter or #
  function getFirstLetter(name){
    const c = name.charAt(0).toUpperCase();
    return (c >= 'A' && c <= 'Z') ? c : '#';
  }

  // ScrollSpy event
  musicListEl.addEventListener('scroll', ()=>{
    if(currentTab === 'songs'){
      onScrollSpy();
    }
  });

  // Initial load
  loadAllMusic().then(() => {
    filteredData = musicData;
    displaySongs(filteredData);
    buildAlphabetNav(filteredData);
    setActiveLetter(filteredData.length ? getFirstLetter(filteredData[0].name) : null);
  });
</script>
</body>
</html>
