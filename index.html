<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Music Library</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * {
    margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif;
  }
  body {
    background: url('https://i.imgur.com/uNWSHGy.png') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 50px 20px;
  }
  .container {
    backdrop-filter: blur(10px) saturate(180%);
    -webkit-backdrop-filter: blur(10px) saturate(180%);
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 30px;
    width: 100%;
    max-width: 900px;
  }
  h1 {
    color: white; text-align: center; margin-bottom: 20px;
  }
  .search-bar {
    width: 100%; margin-bottom: 20px;
  }
  .search-bar input {
    width: 100%; padding: 12px 15px; border-radius: 15px; border: none; outline: none;
    font-size: 16px; backdrop-filter: blur(8px); background: rgba(255,255,255,0.1); color: white;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.7); }
  .tabs {
    display: flex; justify-content: space-around; margin-bottom: 20px;
  }
  .tab {
    padding: 10px 20px; border-radius: 15px; cursor: pointer; color: white; font-weight: 500; transition: 0.3s;
  }
  .tab.active, .tab:hover {
    background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);
  }
  .music-list {
    list-style: none;
  }
  .music-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.1); border-radius: 15px;
    padding: 12px 15px; margin-bottom: 10px; backdrop-filter: blur(8px);
    cursor: pointer; transition: 0.3s;
  }
  .music-item:hover { background: rgba(255,255,255,0.2); }
  .music-item .info {
    color:white;
  }
  .music-item .info .title {
    font-weight:500; font-size:16px;
  }
  .folder-title {
    color:white; margin-top:20px; font-weight:500; font-size:18px;
    cursor: pointer; padding: 10px 0;
  }
  .folder-content {
    margin-bottom: 20px;
    display: none;
    animation: fadeIn 0.3s ease-in-out;
  }
  .folder-title.active + .folder-content {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>My Music Library</h1>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by song..." />
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="songs">Songs</div>
      <div class="tab" data-tab="folders">Folders</div>
    </div>

    <ul class="music-list" id="music-list"></ul>
  </div>

<script>
  const types = ['bangla','english','hindi','arabic','lofi','slowed-reverbed'];
  let musicData = [];

  async function loadAllMusic() {
    let allSongs = [];
    for(const type of types){
      try{
        const res = await fetch(`data/${type}.json`);
        const data = await res.json();
        data.forEach(song => {
          song.type = type;
        });
        allSongs = allSongs.concat(data);
      } catch(e){
        console.error(`Failed to load ${type}.json`, e);
      }
    }
    // A-Z sort
    allSongs.sort((a, b) => a.name.localeCompare(b.name));
    musicData = allSongs;
  }

  function displaySongs(list){
    const musicList = document.getElementById('music-list');
    if(list.length === 0){
      musicList.innerHTML = `<li style="color:white; text-align:center; padding:20px;">No results found</li>`;
      return;
    }
    musicList.innerHTML = list.map(song => `
      <li class="music-item">
        <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(song.type)}" class="info" style="color:white;text-decoration:none;">
          <span class="title">${song.name}</span>
          <span style="font-size:12px;color:rgba(255,255,255,0.5)">[${song.type}]</span>
        </a>
      </li>
    `).join('');
  }

  function displayFolders(list){
    const musicList = document.getElementById('music-list');
    let html = '';
    types.forEach(type => {
      const songs = list.filter(s => s.type === type);
      if(songs.length > 0){
        // Sort inside folder too
        songs.sort((a, b) => a.name.localeCompare(b.name));
        html += `
          <div class="folder-title">${type.toUpperCase()}</div>
          <div class="folder-content">
            ${songs.map(song=>`
              <li class="music-item">
                <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(type)}" style="color:white;text-decoration:none;">
                  ${song.name}
                </a>
              </li>
            `).join('')}
          </div>
        `;
      }
    });
    musicList.innerHTML = html || `<li style="color:white; text-align:center; padding:20px;">No folders found</li>`;

    // Add toggle functionality
    const folderTitles = document.querySelectorAll('.folder-title');
    folderTitles.forEach(title => {
      title.addEventListener('click', () => {
        title.classList.toggle('active');
      });
    });
  }

  const tabs = document.querySelectorAll('.tab');
  const searchInput = document.getElementById('searchInput');

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const activeTab = tab.dataset.tab;
      if(activeTab==='songs') displaySongs(musicData);
      else if(activeTab==='folders') displayFolders(musicData);
      searchInput.value = '';
    });
  });

  searchInput.addEventListener('input', ()=>{
    const query = searchInput.value.toLowerCase();
    const filtered = musicData.filter(song => song.name.toLowerCase().includes(query));
    const activeTab = document.querySelector('.tab.active').dataset.tab;
    if(activeTab==='songs') displaySongs(filtered);
    else if(activeTab==='folders') displayFolders(filtered);
  });

  loadAllMusic().then(()=> displaySongs(musicData));
</script>

</body>
</html>
