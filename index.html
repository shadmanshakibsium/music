<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Site Header -->
    <header class="site-header">
        <h1>My Music Player</h1>
    </header>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="songs">Songs</div>
        <div class="tab" data-tab="folders">Folders</div>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search songs...">
    </div>

    <!-- Library / Song List -->
    <div id="library-view"></div>

    <!-- Mini Player -->
    <div id="mini-player" class="hidden">
        <div id="miniSongTitle">Song Name</div>
        <div id="miniTime">0:00</div>
        <button id="miniPlayPause">▶</button>
    </div>

    <!-- Fullscreen Player View -->
    <div id="player-view" class="hidden">
        <div class="container">
            <div class="title" id="currentSongTitle">Song Name</div>

            <!-- Progress Bar -->
            <div id="progress">
                <span id="current-time">0:00</span>
                <div id="progress-bar-container">
                    <div id="progress-filled"></div>
                </div>
                <span id="duration">0:00</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="prevBtn" class="control-btn"><i class="fa fa-backward"></i></button>
                <button id="playPauseBtn" class="play-btn">▶</button>
                <button id="nextBtn" class="control-btn"><i class="fa fa-forward"></i></button>
            </div>

            <!-- Volume -->
            <div id="volume-container">
                <i class="fa fa-volume-low"></i>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
                <i class="fa fa-volume-high"></i>
            </div>

            <button id="backToLibrary" class="back-btn">Back to Library</button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer"></audio>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>
</html>
