<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Library</title>
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========= Library View ========= -->
  <div class="container library">
    <div class="header">
      <input type="text" id="searchInput" placeholder="Search music..." />
      <div class="tabs">
        <button class="tab active" data-tab="songs">Songs</button>
        <button class="tab" data-tab="folders">Folders</button>
      </div>
    </div>

    <ul id="music-list"></ul>

    <div id="alphaIndex"></div>
  </div>

  <!-- ========= Player View ========= -->
  <div class="container player" style="display:none;">
    <div id="title" class="title">Loading...</div>

    <div id="progress" title="Seek">
      <span id="current-time">0:00</span>
      <div id="progress-bar-container">
        <div id="progress-filled"></div>
      </div>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button class="control-btn" id="shuffle" title="Shuffle"><i class="fas fa-random"></i></button>
      <button class="control-btn" id="prev" title="Previous"><i class="fas fa-backward"></i></button>
      <button class="control-btn play-btn" id="play" title="Play/Pause"><i class="fas fa-play" id="play-icon"></i></button>
      <button class="control-btn" id="next" title="Next"><i class="fas fa-forward"></i></button>
      <button class="control-btn" id="repeat" title="Repeat"><i class="fas fa-redo" id="repeat-icon"></i></button>
    </div>

    <div id="volume-container">
      <i class="fas fa-volume-down"></i>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1.0" />
      <i class="fas fa-volume-up"></i>
    </div>

    <audio id="audio"></audio>

    <button class="back-btn">Back to Library</button>
  </div>

  <!-- ========= JavaScript ========= -->
  <script src="script.js"></script>
</body>
</html>
