<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Music Library</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * {
    margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif;
  }
  body {
    background: url('https://i.imgur.com/uNWSHGy.png') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    padding: 50px 20px;
  }
  .container {
    backdrop-filter: blur(10px) saturate(180%);
    -webkit-backdrop-filter: blur(10px) saturate(180%);
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 30px;
    width: 100%;
    max-width: 900px;
    margin: auto;
  }
  h1 {
    color: white; text-align: center; margin-bottom: 20px;
  }
  .search-bar {
    width: 100%; margin-bottom: 20px;
  }
  .search-bar input {
    width: 100%; padding: 12px 15px; border-radius: 15px; border: none; outline: none;
    font-size: 16px; backdrop-filter: blur(8px); background: rgba(255,255,255,0.1); color: white;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.7); }
  .tabs {
    display: flex; justify-content: space-around; margin-bottom: 20px;
  }
  .tab {
    padding: 10px 20px; border-radius: 15px; cursor: pointer; color: white; font-weight: 500; transition: 0.3s;
  }
  .tab.active, .tab:hover {
    background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);
  }
  .music-list {
    list-style: none;
  }
  .music-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.1); border-radius: 15px;
    padding: 12px 15px; margin-bottom: 10px; backdrop-filter: blur(8px);
    cursor: pointer; transition: 0.3s;
    
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .music-item:hover { background: rgba(255,255,255,0.2); }
  .music-item .info {
    color:white;
    width: 100%;
    text-decoration: none;
    
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .music-item .info .title {
    font-weight:500; font-size:16px;
  }
  .folder-title {
    color:white; margin-top:20px; font-weight:700; font-size:24px;
    cursor: pointer;
    user-select: none;
    padding: 10px 15px;
    background: rgba(255,255,255,0.15);
    border-radius: 15px;
    transition: background 0.3s;
  }
  .folder-title:hover {
    background: rgba(255,255,255,0.3);
  }

  /* Folder songs list hidden by default */
  .folder-songs {
    display: none;
    margin-bottom: 15px;
    padding-left: 0;
  }
  /* Show when open */
  .folder-songs.open {
    display: block;
  }

  /* alpha index */
  .alpha-index {
    position: fixed;
    right: 30px;
    top: 100px;
    height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    user-select: none;
    z-index: 1000;
    padding: 4px 8px;
    background: rgba(0,0,0,0.15);
    border-radius: 12px;
    font-weight: 700;
    color: white;
    font-size: 14px;
    transition: all 0.3s ease;
  }

  /* Hide alpha index on mobile */
  @media (max-width: 600px) {
    .alpha-index {
      display: none !important;
    }
  }

  .alpha-index div {
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    text-align: center;
    transition: background 0.3s, color 0.3s;
    white-space: nowrap;
  }
  .alpha-index div:hover,
  .alpha-index div.active {
    background: rgba(255,255,255,0.3);
    color: #000;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>My Music Library</h1>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by song..." />
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="songs">Songs</div>
      <div class="tab" data-tab="folders">Folders</div>
    </div>

    <ul class="music-list" id="music-list"></ul>
  </div>

  <div class="alpha-index" id="alphaIndex"></div>

<script>
  const types = ['bangla','english','hindi','arabic','lofi','slowed-reverbed'];
  let musicData = [];

  async function loadAllMusic() {
    let allSongs = [];
    for(const type of types){
      try{
        const res = await fetch(`data/${type}.json`);
        const data = await res.json();
        data.forEach(song => {
          song.type = type;
        });
        allSongs = allSongs.concat(data);
      } catch(e){
        console.error(`Failed to load ${type}.json`, e);
      }
    }
    musicData = allSongs;
  }

  // Sort songs by name alphabetically, with # last
  function sortSongs(list) {
    return list.slice().sort((a,b) => {
      const aChar = a.name.charAt(0).toUpperCase();
      const bChar = b.name.charAt(0).toUpperCase();

      const isALetter = /^[A-Z]$/.test(aChar);
      const isBLetter = /^[A-Z]$/.test(bChar);

      if(isALetter && !isBLetter) return -1;
      if(!isALetter && isBLetter) return 1;

      if(a.name.toUpperCase() < b.name.toUpperCase()) return -1;
      if(a.name.toUpperCase() > b.name.toUpperCase()) return 1;
      return 0;
    });
  }

  function displaySongs(list){
    const sortedList = sortSongs(list);
    const musicList = document.getElementById('music-list');
    if(sortedList.length === 0){
      musicList.innerHTML = `<li style="color:white; text-align:center; padding:20px;">No results found</li>`;
      return;
    }
    musicList.innerHTML = sortedList.map(song => `
      <li class="music-item" data-name="${song.name}">
        <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(song.type)}" class="info" style="color:white;">
          <span class="title">${song.name}</span>
          <span style="font-size:12px;color:rgba(255,255,255,0.5)"> [${song.type}]</span>
        </a>
      </li>
    `).join('');

    addPlayHandler();
  }

  // Folder toggle state (store which folders are open)
  const folderOpenState = {};

  function displayFolders(list){
    const musicList = document.getElementById('music-list');
    const sortedList = sortSongs(list);
    let html = '';

    types.forEach(type=>{
      const songs = sortedList.filter(s => s.type === type);
      if(songs.length > 0){
        folderOpenState[type] = false; // সব ফোল্ডার প্রথমে ক্লোজড থাকবে

        html += `
          <div class="folder-title" data-type="${type}">${type.toUpperCase()}</div>
          <ul class="folder-songs" data-type="${type}">
            ${songs.map(song=>`
              <li class="music-item" data-name="${song.name}">
                <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(type)}" class="info" style="color:white;">
                  ${song.name}
                </a>
              </li>
            `).join('')}
          </ul>
        `;
      }
    });
    musicList.innerHTML = html;

    // ফোল্ডার নাম ক্লিক করলে টগল হবে
    document.querySelectorAll('.folder-title').forEach(title => {
      title.addEventListener('click', () => {
        const type = title.getAttribute('data-type');
        folderOpenState[type] = !folderOpenState[type];
        const ul = document.querySelector(`.folder-songs[data-type="${type}"]`);
        ul.classList.toggle('open');
      });
    });

    addPlayHandler();
  }

  // A-Z-# ইনডেক্স
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
  const alphaIndex = document.getElementById('alphaIndex');
  const searchInput = document.getElementById('searchInput');
  const tabs = document.querySelectorAll('.tab');

  // ইনডেক্সে অক্ষর বসানো
  alphabet.forEach(letter => {
    const div = document.createElement('div');
    div.textContent = letter;
    div.addEventListener('click', () => {
      scrollToLetter(letter);
    });
    alphaIndex.appendChild(div);
  });

  function scrollToLetter(letter) {
    const activeTab = document.querySelector('.tab.active').dataset.tab;
    const listItems = [...document.querySelectorAll('.music-item')];

    let targetItem;

    if(letter === '#'){
      targetItem = listItems.find(li => {
        const firstChar = li.getAttribute('data-name').charAt(0).toUpperCase();
        return !(/[A-Z]/.test(firstChar));
      });
    } else {
      targetItem = listItems.find(li => li.getAttribute('data-name').charAt(0).toUpperCase() === letter);
    }
    if(targetItem){
      targetItem.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  }

  // হাইলাইট active অক্ষর ইনডেক্সে
  function highlightActiveLetter(){
    const activeTab = document.querySelector('.tab.active').dataset.tab;
    const listItems = [...document.querySelectorAll('.music-item')];
    if(listItems.length === 0) return;

    const scrollY = window.scrollY || window.pageYOffset;
    let currentLetter = null;

    for(let i = 0; i < listItems.length; i++){
      const li = listItems[i];
      const rect = li.getBoundingClientRect();
      if(rect.top + window.scrollY > scrollY + 10){
        const name = li.getAttribute('data-name');
        const firstChar = name.charAt(0).toUpperCase();
        if(/[A-Z]/.test(firstChar)){
          currentLetter = firstChar;
        } else {
          currentLetter = '#';
        }
        break;
      }
    }
    if(!currentLetter){
      const lastName = listItems[listItems.length-1].getAttribute('data-name');
      const firstChar = lastName.charAt(0).toUpperCase();
      currentLetter = /[A-Z]/.test(firstChar) ? firstChar : '#';
    }

    [...alphaIndex.children].forEach(div => {
      div.classList.remove('active');
      if(div.textContent === currentLetter){
        div.classList.add('active');
      }
    });
  }

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const activeTab = tab.dataset.tab;
      searchInput.value = '';
      if(activeTab==='songs') displaySongs(musicData);
      else if(activeTab==='folders') displayFolders(musicData);
      highlightActiveLetter();
    });
  });

  searchInput.addEventListener('input', ()=>{
    const query = searchInput.value.toLowerCase();
    const filtered = musicData.filter(song => song.name.toLowerCase().includes(query));
    const activeTab = document.querySelector('.tab.active').dataset.tab;
    if(activeTab==='songs') displaySongs(filtered);
    else if(activeTab==='folders') displayFolders(filtered);
    highlightActiveLetter();
  });

  window.addEventListener('scroll', ()=>{
    highlightActiveLetter();
  });

  // গান প্লে করার জন্য গানের যেকোনো জায়গায় ক্লিক হ্যান্ডলার
  function addPlayHandler(){
    document.querySelectorAll('.music-item').forEach(item=>{
      item.onclick = (e) => {
        // prevent multiple triggering if clicking the link inside
        if(e.target.tagName.toLowerCase() === 'a') return;
        const link = item.querySelector('a');
        if(link) {
          // নতুন উইন্ডোতে গান লিংক খুলবে
          window.open(link.href, '_blank');
        }
      }
    });
  }

  loadAllMusic().then(()=>{
    displaySongs(musicData);
    highlightActiveLetter();
  });
</script>

</body>
</html>
