<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Library</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<!-- Header -->
<div class="site-header">
  <h1>My Music Library</h1>
</div>

<!-- Library View -->
<div id="library-view">
  <!-- Search Bar -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search songs...">
  </div>

  <!-- Language Tabs -->
  <div class="tabs">
    <div class="tab active" data-lang="bangla">Bangla</div>
    <div class="tab" data-lang="english">English</div>
  </div>

  <!-- Music List -->
  <ul class="music-list" id="music-list"></ul>
</div>

<!-- Mini Player -->
<div class="mini-player" id="mini-player">
  <div id="mini-title">No song playing</div>
  <button id="mini-play"><i class="fa fa-play"></i></button>
</div>

<!-- Fullscreen Player -->
<div class="fullscreen-player" id="fullscreen-player">
  <div class="fs-header">
    <span id="fs-title">Song Name</span>
    <button id="fs-close"><i class="fa fa-times"></i></button>
  </div>
  <audio id="audio" controls></audio>
  <div class="fs-controls">
    <button id="prev"><i class="fa fa-backward"></i></button>
    <button id="play"><i class="fa fa-play"></i></button>
    <button id="next"><i class="fa fa-forward"></i></button>
    <button id="shuffle"><i class="fa fa-random"></i></button>
    <button id="repeat"><i class="fa fa-repeat"></i></button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
