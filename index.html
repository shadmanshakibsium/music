<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Song Archive</title>
<link rel="icon" type="image/png" sizes="16x16" href="logo/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="logo/android-chrome-192x192.png">
<link rel="stylesheet" href="style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<!-- Main Content Wrapper -->
<div id="main-content">

  <!-- Header -->
  <div class="site-header">
    <h1>Song Archive</h1>
  </div>

  <!-- Tabs for All Songs / Folders -->
  <div class="tabs">
    <div class="tab active" data-view="all">All Songs</div>
    <div class="tab" data-view="folders">Folders</div>
  </div>

  <!-- All Songs View -->
  <div id="all-songs-view">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search songs...">
       <div id="songCount">Total Songs: 0</div>
    </div>
    <ul class="music-list" id="music-list"></ul>
  </div>

  <!-- Folders View -->
  <div id="folders-view" style="display:none;">
    <div id="folder-list"></div>
  </div>

</div> <!-- end main-content -->

<!-- Mini Player -->
<div class="mini-player" id="mini-player">
  <div id="mini-title">No song playing</div>
  <button id="mini-play"><i class="fa fa-play"></i></button>
</div>

<!-- Fullscreen Player -->
<div class="fullscreen-player" id="fullscreen-player" style="display:none;">
  <div class="container">
    <div class="title" id="fs-title"><b>Song Name</b></div>

    <!-- Progress Bar -->
    <div id="progress">
      <span id="current-time">0:00</span>
      <div id="progress-bar-container">
        <div id="progress-filled"></div>
      </div>
      <span id="duration">0:00</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="control-btn" id="fs-shuffle" title="Shuffle"><i class="fas fa-random"></i></button>
      <button class="control-btn" id="fs-prev" title="Previous"><i class="fas fa-backward"></i></button>
      <button class="control-btn play-btn" id="fs-play" title="Play/Pause"><i class="fas fa-play" id="fs-play-icon"></i></button>
      <button class="control-btn" id="fs-next" title="Next"><i class="fas fa-forward"></i></button>
      <button class="control-btn" id="fs-repeat" title="Repeat"><i class="fas fa-redo" id="fs-repeat-icon"></i></button>
    </div>

    <!-- Volume -->
    <div id="volume-container">
      <i class="fas fa-volume-down"></i>
      <input type="range" id="fs-volume" min="0" max="1" step="0.01" value="1.0">
      <i class="fas fa-volume-up"></i>
    </div>

    <!-- Close Button -->
    <button class="back-btn" id="fs-close">Back to Library</button>

    <!-- Audio -->
    <audio id="fs-audio"></audio>
  </div>
    <!-- Visualizer container wrapping the canvas -->
    <div id="visualizer-container">
      <canvas id="audio-visualizer" width="600" height="100"></canvas>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
