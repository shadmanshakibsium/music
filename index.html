<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Library</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; }

body {
  background: url('https://i.imgur.com/uNWSHGy.png') no-repeat center center fixed;
  background-size: cover;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 50px 20px;
}

.container {
  backdrop-filter: blur(10px) saturate(180%);
  -webkit-backdrop-filter: blur(10px) saturate(180%);
  background-color: rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 30px;
  width: 100%;
  max-width: 900px;
}

h1 { color: white; text-align: center; margin-bottom: 20px; }

.music-list { list-style: none; }
.music-item {
  display: flex; align-items: center;
  background: rgba(255,255,255,0.1); border-radius: 15px;
  padding: 12px 15px; margin-bottom: 10px; backdrop-filter: blur(8px);
  cursor: pointer; transition: 0.3s;
}
.music-item:hover { background: rgba(255,255,255,0.2); }
.music-item a { color:white; text-decoration:none; font-size:16px; font-weight:500; width:100%; }
</style>
</head>
<body>

<div class="container">
  <h1>My Music Library</h1>
  <ul class="music-list" id="music-list"></ul>
</div>

<script>
const types = ['bangla','english','hindi','arabic','lofi','slowed-reverbed'];
let musicData = [];

async function loadAllMusic() {
  let allSongs = [];
  for(const type of types){
    try{
      const res = await fetch(`data/${type}.json`);
      const data = await res.json();
      data.forEach(song => {
        song.type = type;
        song.path = `data/${type}/${song.file}`;
      });
      allSongs = allSongs.concat(data);
    } catch(e){
      console.error(`Failed to load ${type}.json`, e);
    }
  }
  musicData = allSongs;
  displaySongs(musicData);
}

function displaySongs(list){
  if(list.length === 0){
    musicList.innerHTML = `<li style="color:white; text-align:center; padding:20px;">No songs found</li>`;
    return;
  }
  musicList.innerHTML = list.map(song => `
    <li class="music-item">
      <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.path)}">
        ${song.name} <span style="font-size:12px;color:rgba(255,255,255,0.5)">[${song.type}]</span>
      </a>
    </li>
  `).join('');
}

const musicList = document.getElementById('music-list');
loadAllMusic();
</script>

</body>
</html>
