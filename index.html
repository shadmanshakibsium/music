<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 🔎 Search + Song List -->
  <div id="song-list">
    <input type="text" id="search" placeholder="Search song...">
    <div class="music-item" data-src="song1.mp3" data-title="Song One">Song One</div>
    <div class="music-item" data-src="song2.mp3" data-title="Song Two">Song Two</div>
    <div class="music-item" data-src="song3.mp3" data-title="Song Three">Song Three</div>
  </div>

  <!-- 🎵 Mini Player -->
  <div id="mini-player">
    <div>
      <div id="mini-title">No song playing</div>
      <div id="mini-time">00:00</div>
    </div>
    <button id="mini-play">▶</button>
  </div>

  <!-- 🎶 Full Player -->
  <div id="full-player">
    <div class="container">
      <div class="title" id="full-title">No song selected</div>

      <!-- Progress -->
      <div id="progress">
        <span id="current-time">0:00</span>
        <div id="progress-bar-container">
          <div id="progress-filled"></div>
        </div>
        <span id="duration">0:00</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="control-btn" id="prev">⏮</button>
        <button class="play-btn" id="play">▶</button>
        <button class="control-btn" id="next">⏭</button>
      </div>

      <!-- Volume -->
      <div id="volume-container">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step="0.01">
      </div>

      <!-- Back Button -->
      <button class="back-btn" id="back-btn">⬅ Home</button>
    </div>
  </div>

  <audio id="audio"></audio>
  <script src="script.js"></script>
</body>
</html>
