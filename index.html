<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
  * {
    margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif;
  }
  body {
    background: url('https://i.imgur.com/uNWSHGy.png') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    padding: 50px 20px;
  }
  .container {
    backdrop-filter: blur(10px) saturate(180%);
    -webkit-backdrop-filter: blur(10px) saturate(180%);
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 30px;
    width: 100%;
    max-width: 900px;
    margin: auto;
  }
  h1 {
    color: white; text-align: center; margin-bottom: 20px;
  }
  .search-bar {
    width: 100%; margin-bottom: 20px;
  }
  .search-bar input {
    width: 100%; padding: 12px 15px; border-radius: 15px; border: none; outline: none;
    font-size: 16px; backdrop-filter: blur(8px); background: rgba(255,255,255,0.1); color: white;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.7); }
  .tabs {
    display: flex; justify-content: space-around; margin-bottom: 20px;
  }
  .tab {
    padding: 10px 20px; border-radius: 15px; cursor: pointer; color: white; font-weight: 500; transition: 0.3s;
  }
  .tab.active, .tab:hover {
    background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);
  }
  .music-list {
    list-style: none;
  }
  .music-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.1); border-radius: 15px;
    padding: 12px 15px; margin-bottom: 10px; backdrop-filter: blur(8px);
    cursor: pointer; transition: 0.3s;
    
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .music-item:hover { background: rgba(255,255,255,0.2); }
  .music-item .info {
    color:white;
    width: 100%;
    text-decoration: none;
    
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .music-item .info .title {
    font-weight:500; font-size:16px;
  }
  .folder-title {
    color:white; margin-top:20px; font-weight:700; font-size:24px;
    cursor: pointer;
    user-select: none;
    padding: 10px 15px;
    background: rgba(255,255,255,0.15);
    border-radius: 15px;
    transition: background 0.3s;
  }
  .folder-title:hover {
    background: rgba(255,255,255,0.3);
  }

  /* Folder songs list hidden by default */
  .folder-songs {
    display: none;
    margin-bottom: 15px;
    padding-left: 0;
  }
  /* Show when open */
  .folder-songs.open {
    display: block;
  }

  /* alpha index */
  .alpha-index {
    position: fixed;
    right: 30px;
    top: 100px;
    height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    user-select: none;
    z-index: 1000;
    padding: 4px 8px;
    background: rgba(0,0,0,0.15);
    border-radius: 12px;
    font-weight: 700;
    color: white;
    font-size: 14px;
    transition: all 0.3s ease;
  }

  /* Hide alpha index on mobile */
  @media (max-width: 600px) {
    .alpha-index {
      display: none !important;
    }
  }

  .alpha-index div {
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    text-align: center;
    transition: background 0.3s, color 0.3s;
    white-space: nowrap;
  }
  .alpha-index div:hover,
  .alpha-index div.active {
    background: rgba(255,255,255,0.3);
    color: #000;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>My Music Library</h1>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by song..." />
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="songs">Songs</div>
      <div class="tab" data-tab="folders">Folders</div>
    </div>

    <ul class="music-list" id="music-list"></ul>
  </div>

  <div class="alpha-index" id="alphaIndex"></div>

 </style>
</head>
<body>

  <div class="container">
    <h1>My Music Library</h1>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by song..." />
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="songs">Songs</div>
      <div class="tab" data-tab="folders">Folders</div>
    </div>

    <ul class="music-list" id="music-list"></ul>
  </div>

  <div class="alpha-index" id="alphaIndex"></div>

  <script>
    const types = ['anime','arabic','bangla','edit audio','english','hindi','lofi','phonk','slowed-reverbed'];
    let musicData = [];

    function slugify(filename) {
      return filename
        .replace(/\.[^/.]+$/, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    async function loadAllMusic() {
      let allSongs = [];
      for(const type of types){
        try{
          const res = await fetch(`data/${type}.json`);
          const data = await res.json();
          data.forEach(song => {
            song.type = type;
            song.id = slugify(song.file); // Add ID to each song
          });
          allSongs = allSongs.concat(data);
        } catch(e){
          console.error(`Failed to load ${type}.json`, e);
        }
      }
      musicData = allSongs;
    }

    function sortSongs(list) {
      return list.slice().sort((a,b) => {
        const aChar = a.name.charAt(0).toUpperCase();
        const bChar = b.name.charAt(0).toUpperCase();
        const isALetter = /^[A-Z]$/.test(aChar);
        const isBLetter = /^[A-Z]$/.test(bChar);
        if(isALetter && !isBLetter) return -1;
        if(!isALetter && isBLetter) return 1;
        return a.name.localeCompare(b.name);
      });
    }

    function displaySongs(list){
      const sortedList = sortSongs(list);
      const musicList = document.getElementById('music-list');
      if(sortedList.length === 0){
        musicList.innerHTML = `<li style="color:white; text-align:center; padding:20px;">No results found</li>`;
        return;
      }
      musicList.innerHTML = sortedList.map(song => `
        <li class="music-item" data-name="${song.name}" id="${song.id}">
          <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(song.type)}" class="info">
            <span class="title">${song.name}</span>
            <span style="font-size:12px;color:rgba(255,255,255,0.5)"> [${song.type}]</span>
          </a>
        </li>
      `).join('');
      addPlayHandler();
      scrollToSongIfPresent();
    }

    function displayFolders(list){
      const musicList = document.getElementById('music-list');
      const sortedList = sortSongs(list);
      let html = '';
      types.forEach(type => {
        const songs = sortedList.filter(s => s.type === type);
        if (songs.length > 0) {
          html += `
            <div class="folder-title" data-type="${type}">${type.toUpperCase()}</div>
            <ul class="folder-songs" data-type="${type}">
              ${songs.map(song => `
                <li class="music-item" data-name="${song.name}" id="${song.id}">
                  <a href="song.html?name=${encodeURIComponent(song.name)}&file=${encodeURIComponent(song.file)}&folder=${encodeURIComponent(type)}" class="info">${song.name}</a>
                </li>
              `).join('')}
            </ul>
          `;
        }
      });
      musicList.innerHTML = html;

      document.querySelectorAll('.folder-title').forEach(title => {
        title.addEventListener('click', () => {
          const type = title.getAttribute('data-type');
          document.querySelector(`.folder-songs[data-type="${type}"]`).classList.toggle('open');
        });
      });

      addPlayHandler();
      scrollToSongIfPresent();
    }

    function addPlayHandler(){
      document.querySelectorAll('.music-item').forEach(item => {
        item.onclick = (e) => {
          if(e.target.tagName.toLowerCase() === 'a') return;
          const link = item.querySelector('a');
          if(link) window.open(link.href, '_blank');
        };
      });
    }

    const tabs = document.querySelectorAll('.tab');
    const searchInput = document.getElementById('searchInput');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        searchInput.value = '';
        const tabType = tab.dataset.tab;
        if(tabType === 'songs') displaySongs(musicData);
        else if(tabType === 'folders') displayFolders(musicData);
      });
    });

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      const filtered = musicData.filter(song => song.name.toLowerCase().includes(query));
      const activeTab = document.querySelector('.tab.active').dataset.tab;
      if(activeTab === 'songs') displaySongs(filtered);
      else if(activeTab === 'folders') displayFolders(filtered);
    });

    function scrollToSongIfPresent(){
      const params = new URLSearchParams(window.location.search);
      const songId = params.get('song');
      if(songId){
        const el = document.getElementById(songId);
        if(el){
          el.scrollIntoView({behavior: 'smooth', block: 'center'});
          el.style.backgroundColor = 'rgba(255,255,255,0.2)';
          setTimeout(() => {
            el.style.transition = 'background-color 1s';
            el.style.backgroundColor = '';
          }, 1500);
        }
      }
    }

    window.addEventListener('scroll', highlightActiveLetter);

    function highlightActiveLetter(){
      // previous functionality unchanged (optional)
    }

    loadAllMusic().then(() => {
      displaySongs(musicData);
    });
  </script>
</body>
</html>
