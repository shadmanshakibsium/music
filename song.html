<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing</title>
<style>
:root{
    --primary:#ff3e78;
    --secondary:#4e54ff;
    --dark-bg:#0f0f13;
    --card-bg:#1a1a24;
    --text-primary:#fff;
    --text-secondary:#b3b3b3;
    --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
    --glass-bg: rgba(30,30,40,0.6);
    --transition:all 0.3s ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background: var(--dark-bg);
    color: var(--text-primary);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:2rem;
}
.container{
    background: var(--card-bg);
    border-radius:20px;
    padding:2rem;
    max-width:400px;
    width:100%;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    backdrop-filter:blur(10px);
}
h2{
    font-size:1.5rem;
    font-weight:700;
    background: var(--gradient);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:0.5rem;
}
p{color:var(--text-secondary); margin-bottom:1.5rem;}
audio{
    width:100%;
    margin-bottom:1.5rem;
    border-radius:12px;
}
button{
    padding:0.6rem 1.5rem;
    border-radius:50px;
    border:none;
    background: var(--gradient);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    transition: var(--transition);
}
button:hover{
    transform: translateY(-2px) scale(1.05);
    box-shadow:0 6px 20px rgba(255,62,120,0.4);
}
</style>
</head>
<body>
<div class="container">
    <h2 id="song-name">Song Name</h2>
    <p id="song-artist">Artist</p>
    <audio id="player" controls></audio>
    <button onclick="goBack()">Back</button>
</div>

<script>
function goBack(){ window.history.back(); }

const params=new URLSearchParams(window.location.search);
const type=params.get('type');
const file=params.get('file');
const player=document.getElementById('player');
const songName=document.getElementById('song-name');
const songArtist=document.getElementById('song-artist');

if(type && file){
    fetch(`data/${type}.json`)
    .then(res=>res.ok?res.json():[])
    .then(data=>{
        const song=data.find(s=>s.file===decodeURIComponent(file));
        if(song){
            songName.textContent=song.name;
            songArtist.textContent=song.artist||'Unknown';
            player.src=`songs/${type}/${song.file}`;
        }
    })
    .catch(err=>console.error(err));
}
</script>
</body>
</html>
