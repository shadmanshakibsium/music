<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Music Player</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
<style>
  /* পুরো স্ক্রীন জুড়ে উচ্চতা ও স্ক্রোল বন্ধ */
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden; /* স্ক্রল বন্ধ */
    font-family: 'Roboto', sans-serif;
    background: url('https://i.imgur.com/uNWSHGy.png') no-repeat center center fixed;
    background-size: cover;
    color: white;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.55); /* ডার্ক ওভারলে যাতে টেক্সট স্পষ্ট হয় */
    z-index: 0;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  /* প্লেয়ার বক্স */
  .container {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(20px) saturate(180%);
    padding: 30px 25px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
    user-select: none;
  }

  /* টাইটেল */
  .title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 25px;
    letter-spacing: 0.7px;
  }

  /* প্রগ্রেস বার */
  #progress {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    height: 10px;
    cursor: pointer;
    padding: 0 12px;
    gap: 12px;
    position: relative;
  }

  /* টাইম স্প্যানগুলো */
  #progress > span {
    color: white;
    font-size: 13px;
    width: 45px;
    user-select: none;
    font-weight: 500;
  }

  /* প্রগ্রেস ফিল্ড যেটা বাড়বে */
  #progress-filled {
    flex: 1;
    height: 8px;
    background: linear-gradient(90deg, #ff6b6b, #583D91);
    border-radius: 8px;
    transition: width 0.2s ease;
    position: relative;
  }

  .controls {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 35px 0;
    max-width: 360px;
    margin-left: auto;
    margin-right: auto;
  }

  .control-btn {
    width: 54px;
    height: 42px;
    border-radius: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b6b, #fcb045);
    border: none;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.55);
    transition: all 0.3s ease;
    font-size: 18px;
    color: white;
  }

  .control-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px rgba(255, 107, 107, 0.85);
  }

  .play-btn {
    width: 80px;
    height: 50px;
    font-size: 24px;
    border-radius: 26px;
    background: linear-gradient(135deg, #583D91, #7E5CD9);
    box-shadow: 0 0 25px rgba(88, 61, 145, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
  }

  .play-btn:hover {
    transform: scale(1.07);
    box-shadow: 0 0 30px rgba(88, 61, 145, 1);
  }

  .control-btn.active {
    box-shadow: 0 0 25px rgba(255, 107, 107, 1);
  }

  /* ভলিউম কন্ট্রোল */
  #volume-container {
    margin: 18px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    color: white;
  }

  #volume {
    width: 130px;
    cursor: pointer;
    -webkit-appearance: none;
    height: 6px;
    background: rgba(255,255,255,0.25);
    border-radius: 6px;
    outline: none;
    transition: background 0.3s ease;
  }
  #volume:hover {
    background: rgba(255,255,255,0.4);
  }
  #volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    background: #ff6b6b;
    cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 0 5px rgba(255, 107, 107, 0.8);
    transition: background 0.3s ease;
  }
  #volume::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: #ff6b6b;
    cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 0 5px rgba(255, 107, 107, 0.8);
    transition: background 0.3s ease;
  }

  /* ব্যাক বাটন */
  .back-btn {
    display: inline-block;
    padding: 11px 28px;
    border-radius: 25px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(9px);
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: 0.3s;
    margin-top: 18px;
    user-select: none;
  }

  .back-btn:hover {
    background: rgba(255, 255, 255, 0.38);
  }

  /* Responsive মোবাইলের জন্য */
  @media (max-width: 450px) {
    .container {
      max-width: 95vw;
      padding: 20px 15px;
      border-radius: 22px;
    }
    .controls {
      max-width: 100%;
      gap: 8px;
    }
    #volume {
      width: 110px;
    }
    .control-btn {
      width: 46px;
      height: 36px;
      font-size: 16px;
    }
    .play-btn {
      width: 70px;
      height: 45px;
      font-size: 20px;
      border-radius: 22px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div id="title" class="title">Loading...</div>

  <div id="progress" title="Seek">
    <span id="current-time">0:00</span>
    <div id="progress-filled"></div>
    <span id="duration">0:00</span>
  </div>
  
  <div class="controls">
    <button class="control-btn" id="shuffle" title="Shuffle"><i class="fas fa-random"></i></button>
    <button class="control-btn" id="prev" title="Previous"><i class="fas fa-backward"></i></button>
    <button class="control-btn play-btn" id="play" title="Play/Pause"><i class="fas fa-play" id="play-icon"></i></button>
    <button class="control-btn" id="next" title="Next"><i class="fas fa-forward"></i></button>
    <button class="control-btn" id="repeat" title="Repeat"><i class="fas fa-redo" id="repeat-icon"></i></button>
  </div>

  <div id="volume-container">
    <i class="fas fa-volume-down"></i>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" />
    <i class="fas fa-volume-up"></i>
  </div>

  <audio id="audio"></audio>

  <a href="index.html" class="back-btn">Back to Library</a>
</div>

<script>
  // URL থেকে গান, নাম, ফোল্ডার নিবে
  const params = new URLSearchParams(window.location.search);
  const folder = params.get("folder");
  const file = params.get("file");
  const nameFromURL = params.get("name");

  if (!folder || !file || !nameFromURL) {
    alert("Invalid or missing song parameters in URL!");
  }

  const songs = [
    { name: nameFromURL, file: `${folder}/${file}` }
  ];

  const audio = document.getElementById("audio");
  const title = document.getElementById("title");
  const playBtn = document.getElementById("play");
  const playIcon = document.getElementById("play-icon");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const shuffleBtn = document.getElementById("shuffle");
  const repeatBtn = document.getElementById("repeat");
  const repeatIcon = document.getElementById("repeat-icon");
  const progress = document.getElementById("progress");
  const progressFilled = document.getElementById("progress-filled");
  const currentTimeEl = document.getElementById("current-time");
  const durationEl = document.getElementById("duration");
  const volumeSlider = document.getElementById("volume");

  let currentIndex = 0;
  let isPlaying = false;
  let isShuffle = false;
  let isRepeat = false;

  function loadSong(index) {
    const song = songs[index];
    audio.src = "songs/" + song.file;
    title.textContent = song.name;
    resetProgress();
  }

  function resetProgress() {
    progressFilled.style.width = "0%";
    currentTimeEl.textContent = "0:00";
    durationEl.textContent = "0:00";
  }

  function playSong() {
    audio.play().catch(() => {});
    isPlaying = true;
    playIcon.classList.remove("fa-play");
    playIcon.classList.add("fa-pause");
  }

  function pauseSong() {
    audio.pause();
    isPlaying = false;
    playIcon.classList.remove("fa-pause");
    playIcon.classList.add("fa-play");
  }

  playBtn.addEventListener("click", () => {
    if (isPlaying) {
      pauseSong();
    } else {
      playSong();
    }
  });

  prevBtn.addEventListener("click", () => {
    alert("Only one song loaded from URL, no previous song available.");
  });

  nextBtn.addEventListener("click", () => {
    alert("Only one song loaded from URL, no next song available.");
  });

  shuffleBtn.addEventListener("click", () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle("active", isShuffle);
    alert("Shuffle will work when multiple songs are loaded.");
  });

  repeatBtn.addEventListener("click", () => {
    isRepeat = !isRepeat;
    repeatBtn.classList.toggle("active", isRepeat);
    if (isRepeat) {
      repeatIcon.style.color = "#ff6b6b";
    } else {
      repeatIcon.style.color = "white";
    }
  });

  audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFilled.style.width = percent + "%";
      currentTimeEl.textContent = formatTime(audio.currentTime);
      durationEl.textContent = formatTime(audio.duration);
    }
  });

  progress.addEventListener("click", (e) => {
    const width = progress.clientWidth;
    const clickX = e.offsetX;
    const duration = audio.duration;
    audio.currentTime = (clickX / width) * duration;
  });

  audio.addEventListener("ended", () => {
    if (isRepeat) {
      playSong();
    } else {
      pauseSong();
    }
  });

  volumeSlider.addEventListener("input", () => {
    audio.volume = volumeSlider.value;
  });

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60) || 0;
    const secs = Math.floor(seconds % 60) || 0;
    return mins + ":" + (secs < 10 ? "0" : "") + secs;
  }

  // গান লোড
  loadSong(currentIndex);

  // পেজ লোড হলে স্বয়ং প্লে করার চেষ্টা করো (যদি ব্রাউজার অনুমতি দেয়)
  audio.volume = volumeSlider.value;
  audio.play().catch(() => { /* Autoplay blocked */ });
</script>

</body>
</html>
